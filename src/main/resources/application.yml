spring:
  application:
    name: visit-reservation-api

  # 로컬 MySQL 기준. 접속 정보는 환경 변수로 넣고, 없으면 기본값 사용 (.env.example 참고)
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:visit_db}?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        # 2주차 N+1 측정 때 true 로 바꿔 쿼리 수 확인
        generate_statistics: false

# 예약 확정 동시성 제어 방법: unique(A) / pessimistic(B) / pessimistic-caregiver(B', 기본) / optimistic(C) / redisson(D)
reservation:
  lock:
    # 기본값은 보호사 행 락(B'): k6 에서 (보호사, 날짜) 락(B)보다 빨랐음 (README "k6 부하 테스트")
    strategy: ${RESERVATION_LOCK_STRATEGY:pessimistic-caregiver}
  # redisson 을 쓰려면 true 로 바꾸고 Redis 를 띄움 (docker compose up -d redis)
  redis:
    enabled: ${REDIS_ENABLED:false}
    address: redis://${REDIS_HOST:127.0.0.1}:${REDIS_PORT:6379}
