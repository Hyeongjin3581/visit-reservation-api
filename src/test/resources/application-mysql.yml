# ./gradlew mysqlTest 로 실행할 때 쓰는 설정 (로컬 MySQL 또는 CI 의 MySQL 컨테이너)
# 운영용 visit_db 와 섞이지 않게 visit_test 를 따로 만들고, 테스트가 끝나면 테이블을 지움
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/visit_test?createDatabaseIfNotExist=true&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: create-drop
