# push·PR 마다 테스트 실행
# 1) H2 로 전체 테스트 (Redis 컨테이너가 있어서 Redis 분산 락 테스트도 실행됨)
# 2) MySQL 컨테이너로 동시성·응답 시간 테스트 (실제 DB 락 동작 확인)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: visit1234
          MYSQL_DATABASE: visit_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pvisit1234"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=10

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Gradle 실행 권한
        run: chmod +x gradlew

      - name: 전체 테스트 (H2)
        run: ./gradlew test

      - name: 동시성·응답 시간 테스트 (MySQL)
        run: ./gradlew mysqlTest
        env:
          DB_HOST: 127.0.0.1
          DB_PASSWORD: visit1234

      - name: 테스트 결과 보관
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: build/test-results/
